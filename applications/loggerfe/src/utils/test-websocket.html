<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .mock { background: #fff3cd; color: #856404; }
        button {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .data-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>WebSocket 连接测试</h1>
    
    <div class="test-section">
        <h2>连接状态</h2>
        <div id="connectionStatus" class="status disconnected">未连接</div>
        <button onclick="connectWebSocket()">连接 WebSocket</button>
        <button onclick="disconnectWebSocket()">断开连接</button>
        <button onclick="startMockMode()">启动模拟模式</button>
    </div>
    
    <div class="test-section">
        <h2>接收到的数据</h2>
        <div id="dataDisplay" class="data-display">
            <p>暂无数据</p>
        </div>
        <button onclick="clearData()">清空数据</button>
    </div>
    
    <div class="test-section">
        <h2>连接信息</h2>
        <p>WebSocket 地址: <code>ws://10.86.14.25:8001/ros_ws</code></p>
        <p>消息计数: <span id="messageCount">0</span></p>
        <p>最后更新: <span id="lastUpdate">无</span></p>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let isMockMode = false;
        let mockInterval = null;
        
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                alert('WebSocket 已经连接');
                return;
            }
            
            try {
                ws = new WebSocket('ws://10.86.14.25:8001/ros_ws');
                
                ws.onopen = function() {
                    updateStatus('已连接', 'connected');
                    updateLastUpdate();
                };
                
                ws.onmessage = function(event) {
                    messageCount++;
                    updateMessageCount();
                    updateLastUpdate();
                    displayData(event.data);
                };
                
                ws.onclose = function() {
                    updateStatus('连接已关闭', 'disconnected');
                };
                
                ws.onerror = function(error) {
                    updateStatus('连接错误', 'disconnected');
                    console.error('WebSocket 错误:', error);
                };
                
            } catch (error) {
                console.error('连接失败:', error);
                updateStatus('连接失败', 'disconnected');
            }
        }
        
        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
            if (isMockMode) {
                stopMockMode();
            }
            updateStatus('已断开', 'disconnected');
        }
        
        function startMockMode() {
            if (isMockMode) return;
            
            isMockMode = true;
            updateStatus('模拟模式', 'mock');
            
            // 生成模拟数据
            mockInterval = setInterval(() => {
                const mockData = generateMockData();
                messageCount++;
                updateMessageCount();
                updateLastUpdate();
                displayData(JSON.stringify(mockData, null, 2));
            }, 1000);
        }
        
        function stopMockMode() {
            if (mockInterval) {
                clearInterval(mockInterval);
                mockInterval = null;
            }
            isMockMode = false;
        }
        
        function generateMockData() {
            return {
                topic_name: 'vehicle_signals',
                topic_type: 0,
                timestamp: Date.now() * 1000000,
                data: {
                    raw_str: {
                        header: {
                            stamp: Date.now() * 1000000,
                            frame_id: 'vehicle_frame',
                            seq: Math.floor(Math.random() * 10000)
                        },
                        raw_data: JSON.stringify({
                            speed: Math.random() * 100 + 20,
                            rpm: Math.random() * 2000 + 800,
                            temperature: Math.random() * 30 + 70,
                            voltage: Math.random() * 2 + 12
                        }),
                        extra_data: 'Mock data for testing'
                    }
                },
                extra_data: ''
            };
        }
        
        function displayData(data) {
            const display = document.getElementById('dataDisplay');
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            
            let content = '';
            if (typeof data === 'string') {
                try {
                    const parsed = JSON.parse(data);
                    content = `<div><strong>${timestamp}</strong><pre>${JSON.stringify(parsed, null, 2)}</pre></div>`;
                } catch {
                    content = `<div><strong>${timestamp}</strong><pre>${data}</pre></div>`;
                }
            } else {
                content = `<div><strong>${timestamp}</strong><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
            }
            
            display.innerHTML = content + display.innerHTML;
            
            // 限制显示的数据条数
            const items = display.querySelectorAll('div');
            if (items.length > 10) {
                items[items.length - 1].remove();
            }
        }
        
        function clearData() {
            document.getElementById('dataDisplay').innerHTML = '<p>暂无数据</p>';
            messageCount = 0;
            updateMessageCount();
        }
        
        function updateStatus(text, className) {
            const status = document.getElementById('connectionStatus');
            status.textContent = text;
            status.className = `status ${className}`;
        }
        
        function updateMessageCount() {
            document.getElementById('messageCount').textContent = messageCount;
        }
        
        function updateLastUpdate() {
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        }
        
        // 页面加载完成后的初始化
        window.onload = function() {
            updateStatus('未连接', 'disconnected');
        };
        
        // 页面卸载时清理资源
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
            if (mockInterval) {
                clearInterval(mockInterval);
            }
        };
    </script>
</body>
</html>
